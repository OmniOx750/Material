<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f6f8fb" />
  <title>MEKICS Sales Tool Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>MEKICS</strong><span>Sales Tool Hub</span></div>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-product-nav="전체"><span>◫</span><b>전체 Tool</b></button>
        <div class="nav-section-title">PRODUCTS</div>
        <div id="productNav" class="product-nav"></div>
      </nav>

      <div class="side-foot">
        <span class="sync-dot" id="syncDot"></span>
        <div><b id="syncText">연결 확인 중</b><small id="syncSub">Google Sheets 확인 중</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">STRATEGY & PLANNING · SALES ENABLEMENT</p>
          <h1 id="pageTitle">영업 Tool 보유 현황</h1>
          <p class="subtitle" id="pageSubtitle">제품별 영업 자료를 Tool 단위로 확인하고 관리합니다.</p>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="refreshBtn">↻ 새로고침</button>
          <button class="btn primary" id="addBtn">＋ Tool 추가</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="panel overview-panel">
        <div class="overview-copy">
          <div>
            <p class="eyebrow">PRODUCT STATUS</p>
            <h2 id="overviewTitle">전체 제품</h2>
            <p id="overviewDescription">제품을 선택하면 해당 제품의 영업 Tool만 볼 수 있습니다.</p>
          </div>
          <div class="overview-rate" id="overviewRate"></div>
        </div>
        <div class="product-progress" id="productProgress"></div>
      </section>

      <section class="toolbar-panel panel">
        <div class="toolbar">
          <div class="search-wrap"><span>⌕</span><input id="searchInput" placeholder="Tool명, 설명, 비고 검색" /></div>
          <select id="statusFilter"><option value="">모든 상태</option><option>보유</option><option>미보유</option><option>확인중</option></select>
          <select id="categoryFilter"><option value="">모든 분류</option></select>
          <span class="result-count" id="resultCount"></span>
        </div>
      </section>

      <section id="toolSections" class="tool-sections"></section>
      <div class="empty panel" id="emptyState" hidden><div>◎</div><b>조건에 맞는 Tool이 없습니다.</b><span>제품 또는 필터를 변경해보세요.</span></div>
    </main>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="detail-wrap">
      <div class="dialog-head">
        <div><p class="eyebrow" id="detailEyebrow">SALES TOOL</p><h2 id="detailTitle">Tool 상세</h2></div>
        <button class="icon-btn" type="button" id="closeDetail">×</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </dialog>

  <dialog id="itemDialog">
    <form method="dialog" id="itemForm">
      <div class="dialog-head"><div><p class="eyebrow" id="dialogEyebrow">NEW SALES TOOL</p><h2 id="dialogTitle">Tool 추가</h2></div><button value="cancel" class="icon-btn" type="button" id="closeDialog">×</button></div>
      <input type="hidden" id="editId" />
      <div class="form-grid">
        <label>제품<select id="productSelect" required></select></label>
        <label id="newProductWrap" hidden>새 제품명<input id="newProductInput" placeholder="예: MV2000" /></label>
        <label>자료 분류<input id="categoryInput" list="categoryList" required placeholder="예: 제품 소개" /><datalist id="categoryList"></datalist></label>
        <label>번호<input id="noInput" placeholder="예: 14 또는 1-1." /></label>
        <label class="span2">영업 Tool 항목<input id="itemInput" required placeholder="예: 제품 브로슈어" /></label>
        <label class="span2">설명<input id="descriptionInput" placeholder="자료의 용도나 설명" /></label>
        <label>보유 여부<select id="statusInput" required><option>보유</option><option>미보유</option><option>확인중</option></select></label>
        <label>최종 업데이트일<input id="dateInput" type="date" /></label>
        <label class="span2">비고<textarea id="noteInput" rows="3" placeholder="추가 확인사항이나 업데이트 메모"></textarea></label>
      </div>
      <div class="dialog-actions"><button class="btn danger" type="button" id="deleteBtn" hidden>삭제</button><span></span><button class="btn ghost" type="button" id="cancelBtn">취소</button><button class="btn primary" type="submit">저장</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
