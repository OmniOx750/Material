name: One-time unified theme install

on:
  push:
    paths:
      - '.github/workflows/one-time-unified-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link shared UI theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="mekics-glass-theme.css?v=20260908" />\n'
          if 'mekics-glass-theme.css' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-unified-theme.yml
      - name: Commit UI install
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-unified-theme.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply unified pastel glass UI to Material'
          git push origin HEAD:main
